<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Health Recap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#184f95"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- year comparison bars, rising toward a peak -->
  <g fill="#ffffff" opacity="0.92">
    <rect x="96"  y="300" width="46" height="116" rx="12"/>
    <rect x="163" y="250" width="46" height="166" rx="12"/>
    <rect x="230" y="150" width="46" height="266" rx="12"/>
    <rect x="297" y="222" width="46" height="194" rx="12"/>
    <rect x="364" y="286" width="46" height="130" rx="12"/>
  </g>
  <!-- heartbeat pulse across the top -->
  <path d="M84 150 h70 l24 -52 30 104 26 -76 22 46 h72"
        fill="none" stroke="#1baf7a" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
